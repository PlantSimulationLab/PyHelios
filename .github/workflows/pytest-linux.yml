name: pytest-linux

on:
  push:
    # release only. A candidate is force-pushed here and amended until green, then master
    # is fast-forwarded to that exact SHA - re-running the same commit on master would
    # duplicate a full 3-platform native build and prove nothing.
    branches: [ release ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout PyHelios
      uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install Helios dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libomp-dev libx11-dev xorg-dev libgl1-mesa-dev libegl1-mesa-dev libglu1-mesa-dev libxrandr-dev python3-dev pybind11-dev
        
    - name: Install build dependencies only
      run: |
        python -m pip install --upgrade pip
        
    - name: Build native libraries
      run: |
        python build_scripts/build_helios.py --buildmode release --nogpu --verbose
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-build-artifacts
        path: |
          pyhelios_build/build/
          pyhelios/plugins/*.so
          pyhelios/plugins/*.dylib
        retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout PyHelios
      uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: linux-build-artifacts

    # This job runs on a fresh runner that never saw the build job's apt install.
    # libhelios.so links EGL as of helios-core 1.3.85, and unlike libGL the runner
    # image does not preinstall libEGL.so.1, so loading the library fails without this.
    - name: Install runtime system libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libgl1 libegl1 libglu1-mesa

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
        
    - name: Run pytest
      run: |
        pytest -v